name: Verify simulation archive
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_bundle.py
